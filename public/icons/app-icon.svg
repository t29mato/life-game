<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59C2F0"/>
      <stop offset="1" stop-color="#2E7FD1"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F8FF"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="118" cy="118" r="44" fill="#FFD34D"/>
  <circle cx="118" cy="118" r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8"/>

  <!-- winding road: shadow then road -->
  <path d="M 96 470 C 300 420 90 300 232 252 C 380 202 300 160 368 128"
        fill="none" stroke="#0B3B66" stroke-opacity="0.28" stroke-width="86" stroke-linecap="round"/>
  <path d="M 96 462 C 300 412 90 292 232 244 C 380 194 300 152 368 120"
        fill="none" stroke="url(#path)" stroke-width="80" stroke-linecap="round"/>
  <!-- center dashes so the ribbon reads as a road -->
  <path d="M 96 462 C 300 412 90 292 232 244 C 380 194 300 152 368 120"
        fill="none" stroke="#9DC3E8" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 34"/>

  <!-- board tiles along the road -->
  <circle cx="150" cy="436" r="24" fill="#FF7B6B"/>
  <circle cx="196" cy="288" r="24" fill="#FFD34D"/>
  <circle cx="300" cy="212" r="24" fill="#6BD08B"/>
  <circle cx="150" cy="436" r="24" fill="none" stroke="#0B3B66" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="196" cy="288" r="24" fill="none" stroke="#0B3B66" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="300" cy="212" r="24" fill="none" stroke="#0B3B66" stroke-opacity="0.18" stroke-width="6"/>

  <!-- goal flag at road's end -->
  <rect x="362" y="52" width="14" height="96" rx="7" fill="#8A5A3B"/>
  <path d="M 376 58 L 468 84 L 376 112 Z" fill="#E8503A"/>
  <path d="M 376 58 L 468 84 L 376 112 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
</svg>
